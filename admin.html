<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXSN Nexus — لوحة التحكم</title><link rel="stylesheet" href="style.css"></head>
<body class="admin">
<header class="topbar"><a class="brand" href="index.html">MXSN <span>Nexus</span></a><a href="index.html">← المتجر</a></header>
<main class="admin-wrap">
<h1>لوحة التحكم</h1><p class="muted">هذه نسخة إدارة أولية تعمل من المتصفح. قبل البيع الحقيقي سنربطها بقاعدة بيانات وحساب مالك آمن.</p>
<div class="panel"><h2>إضافة منتج</h2>
<form id="productForm">
<input id="name" placeholder="اسم المنتج" required>
<input id="price" type="number" step="0.01" placeholder="السعر بالدولار" required>
<input id="image" placeholder="رابط صورة المنتج (اختياري)">
<textarea id="description" placeholder="وصف المنتج" required></textarea>
<input id="fileUrl" placeholder="رابط ملف المنتج بعد الرفع (اختياري)">
<button class="primary">إضافة المنتج</button>
</form></div>
<div class="panel"><h2>منتجاتك</h2><div id="adminProducts"></div></div>
<div class="panel"><h2>إعدادات التواصل</h2>
<input id="instagram" placeholder="رابط Instagram"><input id="facebook" placeholder="رابط Facebook"><input id="tiktok" placeholder="رابط TikTok">
<button class="primary" onclick="saveSocial()">حفظ</button></div>
</main><script src="admin.js"></script></body></html>
